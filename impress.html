<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Are You Impressed?</title>
<style>
  :root {
    --pink: #ff6fa5;
    --pink-dark: #e0518a;
    --bg1: #ffe0ec;
    --bg2: #ffd1e6;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  body {
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .card {
    background: rgba(255, 255, 255, 0.85);
    border-radius: 24px;
    padding: 50px 40px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(224, 81, 138, 0.3);
    max-width: 90vw;
    width: 480px;
    position: relative;
    animation: pop 0.4s ease;
  }

  @keyframes pop {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  h1 {
    color: var(--pink-dark);
    font-size: 1.8em;
    margin-bottom: 30px;
    line-height: 1.3;
  }

  .btn-row {
    display: flex;
    justify-content: center;
    gap: 20px;
    position: relative;
    height: 60px;
  }

  button {
    padding: 14px 32px;
    font-size: 1.1em;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-weight: 600;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 6px 15px rgba(0,0,0,0.12);
  }

  button:active {
    transform: scale(0.95);
  }

  .yes-btn {
    background: var(--pink);
    color: white;
  }

  .yes-btn:hover {
    background: var(--pink-dark);
    transform: translateY(-2px);
  }

  .no-btn {
    background: #f0f0f0;
    color: #555;
  }

  .no-btn:hover {
    background: #e2e2e2;
  }

  .no-btn.runaway {
    position: fixed;
    z-index: 999;
    transition: top 0.15s ease, left 0.15s ease;
  }

  .stage {
    display: none;
  }

  .stage.active {
    display: block;
  }

  .emoji {
    font-size: 2.2em;
    display: block;
    margin-bottom: 10px;
  }

  #finalScreen {
    display: none;
    text-align: center;
  }

  #finalScreen.active {
    display: block;
  }

  #finalScreen h1 {
    font-size: 2.2em;
  }

  .hearts-bg span {
    position: fixed;
    top: -10%;
    font-size: 1.5em;
    animation: fall linear infinite;
    opacity: 0.8;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes fall {
    to {
      transform: translateY(110vh) rotate(360deg);
    }
  }

  .hint {
    margin-top: 18px;
    font-size: 0.85em;
    color: #b56;
    opacity: 0.8;
  }

  @media (max-width: 420px) {
    .card {
      padding: 35px 20px;
      width: 92vw;
    }
    h1 {
      font-size: 1.4em;
    }
    button {
      padding: 12px 22px;
      font-size: 1em;
    }
    .btn-row {
      gap: 12px;
    }
  }
</style>
</head>
<body>

<div class="hearts-bg" id="heartsBg"></div>

<div class="card" id="mainCard">

  <!-- Stage 1 -->
  <div class="stage active" data-stage="1">
    <h1>Are you impressed? 😏</h1>
    <div class="btn-row">
      <button class="yes-btn" onclick="goToFinal()">Yes</button>
      <button class="no-btn" id="noBtn1" onclick="goToStage(2)">No</button>
    </div>
  </div>

  <!-- Stage 2 -->
  <div class="stage" data-stage="2">
    <h1>Are you sure? 🤨</h1>
    <div class="btn-row">
      <button class="yes-btn" onclick="goToStage(3)">Yes</button>
      <button class="no-btn" id="noBtn2" onclick="goToStage(1)">No</button>
    </div>
  </div>

  <!-- Stage 3 -->
  <div class="stage" data-stage="3">
    <span class="emoji">😏</span>
    <h1>You HAVE to be impressed.<br>Are you impressed now?</h1>
    <div class="btn-row">
      <button class="yes-btn" onclick="goToFinal()">Yes</button>
      <button class="no-btn runaway" id="noBtn3" onmouseover="runAway()" onclick="runAway()" ontouchstart="runAway(); event.preventDefault();">No</button>
    </div>
    <p class="hint">(psst... that "No" button isn't going to cooperate 😉)</p>
  </div>

</div>

<!-- Final Screen -->
<div class="card" id="finalScreen">
  <span class="emoji">🥰</span>
  <h1 id="finalMessage">I knew you'd come around 😘<br><br>I love you so much, and I just wanted to remind you of that today. You're the best thing that's happened to me. ❤️</h1>
</div>

<script>
  // ---------------------------------------------------------
  // EDIT THIS to whatever final message you want to show her!
  // You can use <br> for line breaks and emojis freely.
  // ---------------------------------------------------------
  const FINAL_MESSAGE = "Yeah I knew it!!! 😄";

  document.getElementById('finalMessage').innerHTML = FINAL_MESSAGE;

  function goToStage(stageNum) {
    document.querySelectorAll('.stage').forEach(s => s.classList.remove('active'));
    document.querySelector('[data-stage="' + stageNum + '"]').classList.add('active');
  }

  function goToFinal() {
    document.getElementById('mainCard').style.display = 'none';
    document.getElementById('finalScreen').classList.add('active');
    launchHearts();
  }

  function runAway() {
    const btn = document.getElementById('noBtn3');
    const btnWidth = btn.offsetWidth;
    const btnHeight = btn.offsetHeight;
    const maxX = window.innerWidth - btnWidth - 20;
    const maxY = window.innerHeight - btnHeight - 20;
    const newX = Math.max(10, Math.random() * maxX);
    const newY = Math.max(10, Math.random() * maxY);
    btn.style.left = newX + 'px';
    btn.style.top = newY + 'px';
  }

  function launchHearts() {
    const container = document.getElementById('heartsBg');
    const heartsEmojis = ['❤️', '💕', '💖', '💗', '💓'];
    for (let i = 0; i < 40; i++) {
      setTimeout(() => {
        const span = document.createElement('span');
        span.textContent = heartsEmojis[Math.floor(Math.random() * heartsEmojis.length)];
        span.style.left = Math.random() * 100 + 'vw';
        span.style.animationDuration = (3 + Math.random() * 4) + 's';
        span.style.fontSize = (1 + Math.random() * 1.5) + 'em';
        container.appendChild(span);
        setTimeout(() => span.remove(), 8000);
      }, i * 150);
    }
  }
</script>

</body>
</html>
